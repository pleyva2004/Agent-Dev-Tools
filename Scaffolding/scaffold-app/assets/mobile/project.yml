name: __APP_NAME__
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  __APP_NAME__:
    type: application
    platform: iOS
    sources:
      - App
      - Features
      - Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  __APP_NAME__Tests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: __APP_NAME__
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__.tests
schemes:
  __APP_NAME__:
    build:
      targets:
        __APP_NAME__: all
    test:
      targets:
        - __APP_NAME__Tests
