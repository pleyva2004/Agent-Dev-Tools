name: AgentDevDemo
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  AgentDevDemo:
    type: application
    platform: iOS
    sources:
      - App
      - Features
      - Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pleyva.agentdevdemo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  AgentDevDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: AgentDevDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pleyva.agentdevdemo.tests
schemes:
  AgentDevDemo:
    build:
      targets:
        AgentDevDemo: all
    test:
      targets:
        - AgentDevDemoTests
